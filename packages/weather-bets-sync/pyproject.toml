[project]
name = "weather-bets-sync"
version = "0.1.0"
description = "Automatic provider reconciliation for the local weather bet journal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["weather-bets", "weather-cli", "kalshi-weather-markets-cli"]

[project.scripts]
weather-bets-sync = "weather_bets_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
