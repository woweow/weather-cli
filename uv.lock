version = 1
revision = 1
requires-python = ">=3.11"

[manifest]
members = [
    "kalshi-weather-markets-cli",
    "weather-bets",
    "weather-bets-sync",
    "weather-cli",
    "weather-dashboard-cli",
]

[[package]]
name = "kalshi-weather-markets-cli"
version = "0.1.0"
source = { editable = "packages/kalshi-weather-markets-cli" }

[[package]]
name = "weather-bets"
version = "0.1.0"
source = { editable = "packages/weather-bets" }

[[package]]
name = "weather-bets-sync"
version = "0.1.0"
source = { editable = "packages/weather-bets-sync" }
dependencies = [
    { name = "kalshi-weather-markets-cli" },
    { name = "weather-bets" },
    { name = "weather-cli" },
]

[package.metadata]
requires-dist = [
    { name = "kalshi-weather-markets-cli", editable = "packages/kalshi-weather-markets-cli" },
    { name = "weather-bets", editable = "packages/weather-bets" },
    { name = "weather-cli", editable = "packages/weather-cli" },
]

[[package]]
name = "weather-cli"
version = "0.1.0"
source = { editable = "packages/weather-cli" }

[[package]]
name = "weather-dashboard-cli"
version = "0.1.0"
source = { editable = "packages/weather-dashboard-cli" }
dependencies = [
    { name = "weather-bets" },
]

[package.metadata]
requires-dist = [{ name = "weather-bets", editable = "packages/weather-bets" }]
